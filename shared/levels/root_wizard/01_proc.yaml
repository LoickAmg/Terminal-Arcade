id: rw_proc_01
title: "Processus fantôme"
hook: "Quelque chose tourne sur ce serveur. Trouve-le, arrête-le, et ce qui le protège."
tier: root_wizard
tree: system_overlord
runtime: docker
type: classic
replay: { chaos: true, timer: true }
timer: { mode: random, duration_s: 300, par_s: 140 }
intro: "Processus : ps, pgrep, kill, top."
setup: |
  mkdir -p ~/.bin
  cp /bin/sleep ~/.bin/virus
  cp /bin/bash ~/.bin/gardien
  cp /usr/bin/yes ~/.bin/miner
questions:
  - kind: task
    prompt: "Un processus nommé virus tourne. Trouve son PID et envoie-le avec submit."
    setup: 'pgrep -x virus >/dev/null || { setsid nohup ~/.bin/virus 100000 >/dev/null 2>&1 & sleep 0.2; }'
    check: 'answer-is "$(pgrep -x virus | head -n 1)"'
    solution: "pgrep virus (ou ps aux | grep virus), puis submit <PID>"
    solve: |
      submit "$(pgrep -x virus | head -n 1)"
    hints:
      - text: "pgrep NOM affiche le PID des processus qui portent ce nom."
    variant:
      kind: task
      prompt: "Un processus nommé daemon tourne. Trouve son PID et envoie-le avec submit."
      setup: |
        mkdir -p ~/.bin
        cp /bin/sleep ~/.bin/daemon
        pgrep -x daemon >/dev/null || { setsid nohup ~/.bin/daemon 100000 >/dev/null 2>&1 & sleep 0.2; }
      check: |
        answer-is "$(pgrep -x daemon | head -n 1)"
      solution: "pgrep daemon (ou ps aux | grep daemon), puis submit <PID>"
      solve: |
        submit "$(pgrep -x daemon | head -n 1)"

  - kind: task
    prompt: "Arrête ce processus."
    setup: 'pgrep -x virus >/dev/null || { setsid nohup ~/.bin/virus 100000 >/dev/null 2>&1 & sleep 0.2; }'
    check: '! pgrep -x virus >/dev/null'
    solution: "kill <PID> (ou pkill virus)"
    solve: |
      pkill -x virus
    hints:
      - text: "kill PID envoie un signal d'arrêt au processus."
    variant:
      kind: task
      prompt: "Arrête ce processus."
      setup: |
        mkdir -p ~/.bin
        [ -x ~/.bin/daemon ] || cp /bin/sleep ~/.bin/daemon
        pgrep -x daemon >/dev/null || { setsid nohup ~/.bin/daemon 100000 >/dev/null 2>&1 & sleep 0.2; }
      check: |
        ! pgrep -x daemon >/dev/null
      solution: "kill <PID> (ou pkill daemon)"
      solve: |
        pkill -x daemon

  - kind: task
    prompt: "Le virus revient : un processus gardien le relance chaque seconde. Arrête-les pour de bon."
    setup: |
      setsid nohup ~/.bin/gardien -c 'while true; do pgrep -x virus >/dev/null || setsid ~/.bin/virus 100000 >/dev/null 2>&1 & sleep 1; done' >/dev/null 2>&1 &
    check: |
      ! pgrep -x gardien >/dev/null && ! pgrep -x virus >/dev/null || exit 1
      sleep 1.2
      ! pgrep -x virus >/dev/null
    solution: "pkill gardien, puis pkill virus"
    solve: |
      pkill -x gardien; sleep 0.3; pkill -x virus
    hints:
      - text: "Arrête d'abord celui qui relance l'autre."
    variant:
      kind: task
      prompt: "Le daemon revient : un processus superviseur le relance chaque seconde. Arrête-les pour de bon."
      setup: |
        [ -x ~/.bin/daemon ] || cp /bin/sleep ~/.bin/daemon
        setsid nohup ~/.bin/gardien -c 'while true; do pgrep -x daemon >/dev/null || setsid ~/.bin/daemon 100000 >/dev/null 2>&1 & sleep 1; done' >/dev/null 2>&1 &
      check: |
        ! pgrep -x gardien >/dev/null && ! pgrep -x daemon >/dev/null
      solution: "pkill gardien, puis pkill daemon"
      solve: |
        pkill -x gardien; sleep 0.3; pkill -x daemon

  - kind: task
    prompt: "Un processus monopolise le processeur. Trouve-le (top ou ps) et arrête-le."
    setup: 'setsid nohup ~/.bin/miner >/dev/null 2>&1 &'
    check: '! pgrep -x miner >/dev/null'
    solution: "ps aux --sort=-%cpu | head, puis pkill miner"
    solve: |
      pkill -x miner
    hints:
      - text: "ps aux --sort=-%cpu classe les processus du plus gourmand au moins gourmand."
    variant:
      kind: task
      prompt: "Un processus nommé worker monopolise le processeur. Trouve-le et arrête-le."
      setup: |
        cp /usr/bin/yes ~/.bin/worker
        setsid nohup ~/.bin/worker >/dev/null 2>&1 &
      check: |
        ! pgrep -x worker >/dev/null
      solution: "ps aux --sort=-%cpu | head, puis pkill worker"
      solve: |
        pkill -x worker

rewards:
  xp: 380
  unlocks: [rw_script_01, rw_shellcraft_01]
